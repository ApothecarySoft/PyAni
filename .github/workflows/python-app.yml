  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'ref/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-files

      - name: Zip OS Artifact Directories
        run: |
          cd ./release-files
          for dir in */; do
            if [ -d "$dir" ]; then
              dirname=$(basename "$dir")
              echo "Zipping directory: $dirname"
              zip -r "${dirname}.zip" "$dir"
            fi
          done
        shell: bash

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./release-files/*.zip"
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
